name: typescript-ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Core revision to test (branch, tag, or full SHA)"
        required: false
        default: main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical fixtures
        uses: actions/checkout@v4
        with:
          repository: ReproPack/repropack-core
          path: repropack-core
          ref: ${{ inputs.core_ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Record canonical revision
        working-directory: repropack-core
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing ReproPack Core revision: $(git rev-parse HEAD)"
      - name: Typecheck
        run: npm run typecheck
      - name: Tests and build
        env:
          REPROPACK_CORE: ${{ github.workspace }}/repropack-core
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Package validation
        run: npm pack --dry-run
      - name: Documentation foundation
        run: test -f README.md && test -f docs/ARCHITECTURE.md && test -f PROJECT_STATE.md
