<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ReproPack TypeScript architecture</title><desc id="desc">The TypeScript implementation validates the shared ReproPack format, handles ZIP bundles, verifies hashes, redacts explicitly, and extracts safely.</desc>
  <defs><style>.bg{fill:#f7f9fc}.title{font:700 30px system-ui,sans-serif;fill:#132238}.sub{font:16px system-ui,sans-serif;fill:#526274}.label{font:700 17px system-ui,sans-serif;fill:#132238}.small{font:14px system-ui,sans-serif;fill:#526274}.box{stroke-width:2}.arrow{stroke:#7d8da3;stroke-width:3;fill:none;marker-end:url(#head)}</style><marker id="head" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7d8da3"/></marker></defs>
  <rect class="bg" width="1200" height="430" rx="24"/><text x="60" y="62" class="title">TypeScript implementation</text><text x="60" y="90" class="sub">A native Node.js path from untrusted bytes to verified evidence</text>
  <rect x="55" y="145" width="210" height="125" rx="18" fill="#e7efff" stroke="#2563eb" class="box"/><text x="160" y="185" text-anchor="middle" class="label">Manifest model</text><text x="160" y="212" text-anchor="middle" class="small">Types · limits</text><text x="160" y="235" text-anchor="middle" class="small">canonical JSON</text>
  <rect x="335" y="145" width="210" height="125" rx="18" fill="#e8f8f1" stroke="#10b981" class="box"/><text x="440" y="185" text-anchor="middle" class="label">Bundle I/O</text><text x="440" y="212" text-anchor="middle" class="small">stored ZIP</text><text x="440" y="235" text-anchor="middle" class="small">bounded reads</text>
  <rect x="615" y="145" width="210" height="125" rx="18" fill="#fff4dc" stroke="#f59e0b" class="box"/><text x="720" y="185" text-anchor="middle" class="label">Integrity</text><text x="720" y="212" text-anchor="middle" class="small">SHA-256 verify</text><text x="720" y="235" text-anchor="middle" class="small">redaction helpers</text>
  <rect x="895" y="145" width="250" height="125" rx="18" fill="#f1eaff" stroke="#8b5cf6" class="box"/><text x="1020" y="185" text-anchor="middle" class="label">Safe extraction</text><text x="1020" y="212" text-anchor="middle" class="small">traversal rejection</text><text x="1020" y="235" text-anchor="middle" class="small">no execution</text>
  <path class="arrow" d="M265 207 L335 207"/><path class="arrow" d="M545 207 L615 207"/><path class="arrow" d="M825 207 L895 207"/><rect x="290" y="330" width="620" height="48" rx="24" fill="#132238"/><text x="600" y="361" text-anchor="middle" font="600 16px system-ui,sans-serif" fill="white">Shared ReproPack specification + conformance fixtures</text>
</svg>
